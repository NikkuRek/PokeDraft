<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéDraft - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-mesh min-h-screen text-slate-100 font-sans selection:bg-blue-500 selection:text-white">
  
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 max-w-6xl animate-fade-in relative z-10">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-center mb-8 sm:mb-12 gap-4">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 drop-shadow-md">Admin Dashboard</h1>
        <a href="/" class="glass-button px-5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 text-white">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
          Volver a PokéDraft
        </a>
    </div>

    <!-- Summary Box -->
    <div id="summary" class="glass rounded-xl p-5 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="p-3 bg-blue-500/20 rounded-lg">
          <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <div>
          <p class="text-sm text-blue-200 uppercase tracking-widest font-semibold">Total de Participantes</p>
          <p class="text-2xl font-bold"><span id="recordCount" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-200">0</span></p>
        </div>
      </div>
      <div>
        <button id="resetDbBtn" class="bg-red-500/80 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-xl border border-red-400/30 transition-all flex items-center gap-2 shadow-lg hover:shadow-red-500/50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          Reiniciar Base de Datos
        </button>
      </div>
    </div>

    <!-- Table Container -->
    <div class="glass rounded-2xl overflow-hidden shadow-2xl border border-white/10">
      <div class="overflow-x-auto">
        <table class="min-w-full leading-normal text-left whitespace-nowrap">
          <thead>
            <tr class="bg-white/5 backdrop-blur-md border-b border-white/10">
              <th class="px-5 py-4 text-xs font-semibold text-blue-200 uppercase tracking-wider">ID</th>
              <th class="px-5 py-4 text-xs font-semibold text-blue-200 uppercase tracking-wider">Usuario</th>
              <th class="px-5 py-4 text-xs font-semibold text-blue-200 uppercase tracking-wider">Pokémones Seleccionados</th>
              <th class="px-5 py-4 text-xs font-semibold text-blue-200 uppercase tracking-wider">Fecha de Registro</th>
            </tr>
          </thead>
          <tbody id="registrosList" class="divide-y divide-white/5">
            <!-- Rows will be populated here by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
